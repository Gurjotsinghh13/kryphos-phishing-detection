services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENV: development
      SECRET_KEY: local-docker-secret-change-me
      DATABASE_URL: sqlite:///./phishing.db
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./data:/app/data
      - ./ml/models:/app/ml/models
    restart: unless-stopped
