# docker-compose.yml
version: "3.9"

services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    volumes:
      - ./backend/data:/app/data
      - ./backend/ml/models:/app/ml/models
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=sqlite:///./phishing.db
      - DEBUG=false
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on: [backend]
    restart: unless-stopped