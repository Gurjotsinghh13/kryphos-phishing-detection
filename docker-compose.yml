services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      ENV: development
      SECRET_KEY: local-docker-secret-change-me
      DATABASE_URL: sqlite:///./phishing.db
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./backend/data:/app/data
      - ./backend/ml/models:/app/ml/models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
